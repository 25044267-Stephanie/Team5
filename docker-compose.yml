# Base Compose stack — used in every environment.
#
# WHY: Production/CD will run `docker compose -f docker-compose.yml up -d`
# (no override), pulling a pre-built image by digest/tag. Local `docker
# compose up` auto-merges docker-compose.override.yml, which adds `build: .`
# so developers do not need a registry.

services:
  db:
    # Multi-arch index digest for mysql:8.4 (Docker Hub, verified 2026-08-01).
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_management}
      MYSQL_USER: ${MYSQL_USER:-hotel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # schema.sql DROPs tables — safe only on first volume init, never as a migrate step.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${IMAGE_NAME:-c270-hotel-management:local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5050}:5050"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-hotel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_management}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
