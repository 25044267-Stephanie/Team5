# Local development overrides — auto-merged by `docker compose up`.
#
# WHY: Keeps `build: .` out of the base file so production never accidentally
# rebuilds from the EC2 checkout. CD sets IMAGE_NAME to the ECR SHA tag and
# runs compose with only docker-compose.yml.

services:
  db:
    # Publish MySQL for MySQL Workbench on Windows.
    # Host 3306 is often taken by the Windows MySQL84 service, so default
    # to 3307 on the host → container 3306.
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"

  app:
    build: .
    image: ${IMAGE_NAME:-c270-hotel-management:local}

    # Legacy rooms/users source for idempotent migrate inside the container.
    volumes:
      - ./data.json:/app/data.json:ro

    environment:
      DOCKER_BOOTSTRAP: "1"

    # Bootstrap tables + seed accounts, then start Gunicorn.
    command:
      [
        "sh",
        "-c",
        "python scripts/docker_bootstrap.py && exec gunicorn --bind 0.0.0.0:5050 --workers 2 --timeout 60 --worker-tmp-dir /tmp app:app",
      ]
