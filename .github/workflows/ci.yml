# Continuous Integration — Stage A (FA Core: build → test → gate before deploy).
#
# WHY this shape (assessor-facing):
# - Four jobs run in strict order: lint → test → build → scan. Each `needs`
#   the previous, so a red stage blocks everything after it — that is the
#   evidence that the pipeline *gates*, not just "runs".
# - Tests use a MySQL 8.4 *service container* with a Docker healthcheck.
#   GitHub waits until healthy before steps start — no fixed `sleep`.
# - Schema: tests/conftest.py already calls db.create_all() in a session
#   fixture, so we do not run init_db.py in CI (same mechanism, fewer steps).
# - Build tags the image with the short git SHA and does NOT push to any
#   registry yet (ECR arrives in Stage B / later deploy phase).
# - Trivy fails the job on HIGH/CRITICAL (Initiative / DevSecOps evidence).
#   ignore-unfixed avoids failing on CVEs with no upstream fix.
# - Actions pinned by commit SHA for supply-chain integrity.
# - No long-lived AWS keys here. CD is `.github/workflows/deploy-aws.yml`
#   (ECR + EC2) and must not run unless this workflow succeeds on main.

name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: c270-hotel-management
  # CI-only throwaway values — never production secrets.
  FLASK_SECRET_KEY: ci-only-secret-not-for-production
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: hotel_test
  MYSQL_PASSWORD: hotel_test_password
  MYSQL_DATABASE: hotel_management_test
  MYSQL_TEST_DATABASE: hotel_management_test

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install lint tools
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      # Format --check is intentionally NOT gated yet: 7 files (incl. app.py)
      # would reformat and destroy blame needed for individual attribution.
      - name: Ruff check
        run: ruff check app.py config.py models.py repository.py scripts tests

  test:
    name: Test (pytest + MySQL 8.4)
    needs: lint
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: hotel_management_test
          MYSQL_USER: hotel_test
          MYSQL_PASSWORD: hotel_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run pytest (111 tests)
        run: |
          mkdir -p reports
          # pipefail: without it, `tee` masks pytest's non-zero exit and the
          # Test job would stay green even when tests fail (breaks FA gating).
          set -o pipefail
          python -m pytest --junitxml=reports/junit.xml --tb=short | tee reports/pytest.txt

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build image (Buildx)
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image tags (short SHA)
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no registry push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha,scope=hotel-app
          cache-to: type=gha,mode=max,scope=hotel-app

      - name: Save image for scan job
        run: docker save "${{ steps.meta.outputs.tag }}" | gzip > /tmp/image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ github.sha }}
          path: /tmp/image.tar.gz
          retention-days: 2

  scan:
    name: Scan image (Trivy)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ github.sha }}
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/image.tar.gz | docker load

      # SHA-pinned post-incident safe release of trivy-action (v0.35.0).
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Export Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: json
          output: trivy-report.json
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14
